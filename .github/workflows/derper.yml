name: Build and Push Multi-Arch Derper Image

on:
  push:
    tags:
      - 'derper-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to process'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  FOLDER_NAME: derper
  IMAGE_NAME: ${{ github.repository_owner }}/derper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine Target Tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TARGET_TAG=${{ inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TARGET_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_TAG }}

      - name: Extract version from tag
        id: extract_version
        run: |
          # Uses TARGET_TAG instead of GITHUB_REF_NAME
          VERSION=${TARGET_TAG#${FOLDER_NAME}-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The 'value' parameter feeds our stripped version tag into the semver parser
            type=semver,pattern={{version}},value=${{ steps.extract_version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.extract_version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.extract_version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7
        with:
          # Targets the specific folder in the monorepo
          context: ./${{ env.FOLDER_NAME }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          no-cache: true
